<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>voice-web | A single-page webapp to annotate human voice</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut　icon" href="favicon.png">
</head>
<body>
  <main>
    <h1>Interactive Audio Annotator</h1>
    <p class='sub'>Upload an audio file, click the waveform to add labels.</p>

    <div id="waveform"></div>

    <div class='tools'>
      <label class='upload'>
        <input type="file">
      </label>
      <label class='zoom'>
        Zoom: <input type="range" min="10" max="1000" value="50" />
      </label>
    </div>

    <h2>Annotation</h2>
    <textarea id="label" disabled></textarea>
  </main>
  <script type='module' src="main.js"></script>
</body>
</html>
